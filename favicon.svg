<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background: rounded terminal window -->
  <rect width="32" height="32" rx="6" fill="#1b1b19"/>
  <!-- Title bar dots -->
  <circle cx="6.5" cy="5.5" r="1.5" fill="#a33a3a"/>
  <circle cx="11" cy="5.5" r="1.5" fill="#bdb8b0"/>
  <circle cx="15.5" cy="5.5" r="1.5" fill="#2d7a52"/>
  <!-- Pipeline: horizontal pipe -->
  <rect x="4" y="14" width="24" height="4" rx="1" fill="#3a3934"/>
  <!-- Data block flowing -->
  <rect x="7" y="15" width="6" height="2" rx="0.5" fill="#2f6f96"/>
  <!-- Vertical branch pipe -->
  <rect x="19" y="18" width="4" height="8" rx="1" fill="#3a3934"/>
  <!-- Second horizontal pipe -->
  <rect x="4" y="22" width="19" height="4" rx="1" fill="#3a3934"/>
  <!-- Data block on second pipe -->
  <rect x="9" y="23" width="5" height="2" rx="0.5" fill="#2d7a52"/>
  <!-- Server/storage icon -->
  <rect x="24" y="12" width="5" height="3" rx="0.5" fill="#2f6f96"/>
  <rect x="24" y="16" width="5" height="3" rx="0.5" fill="#2f6f96" opacity="0.7"/>
  <!-- Blinking LED on server -->
  <circle cx="27.5" cy="13.5" r="0.7" fill="#2d7a52"/>
  <circle cx="27.5" cy="17.5" r="0.7" fill="#2d7a52"/>
</svg>
